[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_torch: marks tests that require torch
    requires_ase: marks tests that require ase
    requires_pymatgen: marks tests that require pymatgen

