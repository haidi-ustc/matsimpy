[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MatSimPy"
version = "0.9.0"
description = "A package for materials simulation and analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "haidi wang", email = "haidi@hfut.edu.cn"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["materials", "simulation", "crystal", "molecule", "dft", "ml"]
urls = {Homepage = "https://gitee.com/haidi-hfut/MatSimPy"}

dependencies = [
    "numpy",
    "scipy",
    "monty",
    "tabulate",
    "pyyaml",
    # imported at module import time by matsimpy.calculator.vasp.{inputs,outputs}
    "orjson",
    # space-group services are needed by builders and VASP k-point generation
    # (0.8.1 listed it only under the 'analysis' extra)
    "spglib",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "pytest-xdist",
    "tomli; python_version < '3.11'",
]
storage = [
    "maggma>=0.70.0",
]
ml = [
    "torch>=2.0.0",
    "torch-geometric>=2.0.0",
]
io = [
    "pymatgen>=2024.0.0",
    "ase>=3.20.0",
    "h5py",
]
builders = [
    "pyxtal>=1.0.0",
    "rdkit",
]
analysis = [
    "spglib",
]
parity = [
    "pymatgen==2025.6.14",
    "spglib",
]
lammps = [
    "pandas",
    "ruamel.yaml",
]
ai = [
    "typer",
    "requests",
    "pyyaml",
]
repl = [
    "prompt-toolkit>=3.0",
    "rich>=13",
]
all = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "pytest-xdist",
    "maggma>=0.70.0",
    "torch>=2.0.0",
    "torch-geometric>=2.0.0",
    "pymatgen>=2024.0.0",
    "ase>=3.20.0",
    "h5py",
    "pyxtal>=1.0.0",
    "rdkit",
    "spglib",
    "pandas",
    "ruamel.yaml",
    "typer",
    "requests",
    "prompt-toolkit>=3.0",
    "rich>=13",
]

[project.scripts]
matsimpy-ai = "matsimpy.ai.cli:app"

[tool.setuptools]
# Automatically discover all packages (equivalent to find_packages())
# This will find all packages under matsimpy/
packages = { find = {} }

[tool.setuptools.package-data]
# Include JSON data files
"matsimpy.core" = ["periodic_table.json"]
"matsimpy.symmetry" = ["*.json", "*.yaml", "*.yml"]
# Runtime data read via MODULE_DIR at import time (0.8.0 sdist omitted these,
# so `import matsimpy.calculator.vasp` raised FileNotFoundError when installed)
"matsimpy.calculator.vasp" = ["*.json", "*.json.bz2", "*.yaml"]
"matsimpy.calculator.lammps" = ["*.yaml", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore:CUDA initialization:UserWarning:torch",
    "ignore:.*pkg_resources is deprecated.*:UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_llm: makes live calls to the configured LLM provider",
    "requires_torch: marks tests that require torch",
    "requires_ase: marks tests that require ase",
    "requires_pymatgen: marks tests that require pymatgen",
    "requires_spglib: marks tests that require spglib",
    "requires_storage: marks tests that require maggma",
    "requires_repl: marks tests that require optional interactive REPL packages",
    "pty: marks interactive terminal behavior tests using a terminal input abstraction",
]
