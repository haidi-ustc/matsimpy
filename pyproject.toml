[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MatSimPy"
version = "0.3.0"
description = "A package for materials simulation and analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "haidi wang", email = "haidi@hfut.edu.cn"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["materials", "simulation", "crystal", "molecule", "dft", "ml"]
urls = {Homepage = "https://gitee.com/haidi-hfut/MatSimPy"}

dependencies = [
    "numpy",
    "scipy",
    "monty",
    "tabulate",
]

[project.optional-dependencies]
cli = [
    "prompt-toolkit",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "pytest-xdist",
    "pyyaml",
    "prompt-toolkit",
]
storage = [
    "maggma>=0.70.0",
]
ml = [
    "torch>=2.0.0",
    "torch-geometric>=2.0.0",
]
io = [
    "pymatgen>=2024.0.0",
    "ase>=3.20.0",
]
builders = [
    "pyxtal>=1.0.0",
    "rdkit",
]
analysis = [
    "spglib",
]
all = [
    "prompt-toolkit",
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "pytest-xdist",
    "maggma>=0.70.0",
    "torch>=2.0.0",
    "torch-geometric>=2.0.0",
    "pymatgen>=2024.0.0",
    "ase>=3.20.0",
    "pyxtal>=1.0.0",
    "rdkit",
    "spglib",
]

[project.scripts]
matsimpy = "matsimpy.ui.cli.__main__:main"

[tool.setuptools]
# Automatically discover all packages (equivalent to find_packages())
# This will find all packages under matsimpy/
packages = { find = {} }

[tool.setuptools.package-data]
# Include JSON data files
"matsimpy.core" = ["periodic_table.json"]
"matsimpy.ui.cli" = ["matsimpy_menu.json"]
"matsimpy.symmetry" = ["*.json", "*.yaml", "*.yml"]
# Include test data files
"tests" = ["POSCAR-cart.vasp", "POSCAR-frac.vasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore:CUDA initialization:UserWarning:torch",
    "ignore:.*pkg_resources is deprecated.*:UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_torch: marks tests that require torch",
    "requires_ase: marks tests that require ase",
    "requires_pymatgen: marks tests that require pymatgen",
    "requires_storage: marks tests that require maggma",
]

