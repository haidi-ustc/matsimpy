[tox]
envlist = py310,py312,py313

[testenv]
extras =
    dev
    builders
    parity
commands =
    python -m pytest {posargs}

[testenv:py310]
basepython = {env:TOX_PY310:/home/haidi/miniconda3/envs/dev310/bin/python}

[testenv:py312]
basepython = {env:TOX_PY312:/home/haidi/miniconda3/envs/dev/bin/python}

[testenv:py313]
basepython = {env:TOX_PY313:/home/haidi/miniconda3/envs/dev313/bin/python}
